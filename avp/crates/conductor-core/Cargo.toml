[package]
name         = "conductor-core"
description  = "Session FSM, driver trait, and supervisor for the conductor — drives N Claude Code subprocesses across PlausiDen worktrees with explicit pause/resume semantics."
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
readme       = "../../README.md"

[lints]
workspace = true

[dependencies]
avp-core    = { workspace = true }

# data / log
serde       = { workspace = true }
serde_json  = { workspace = true }
toml        = { workspace = true }
time        = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
globset     = { workspace = true }

# async
tokio       = { workspace = true }
async-trait = { workspace = true }
futures     = { workspace = true }

[dev-dependencies]
tokio    = { workspace = true, features = ["test-util", "rt-multi-thread", "macros", "time"] }
proptest = { workspace = true }
tempfile = { workspace = true }
test-log = { workspace = true }
