# SECURITY: cargo-deny configuration for the avp workspace.
# Used both internally (avp lints itself) and as the canonical baseline that
# `avp install` writes into PlausiDen sibling repos.
# See: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[output]
feature-depth = 1

[advisories]
db-path        = "~/.cargo/advisory-db"
db-urls        = ["https://github.com/rustsec/advisory-db"]
yanked         = "deny"
ignore         = []
unmaintained   = "workspace"

[licenses]
confidence-threshold = 0.95
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "Zlib",
    "AGPL-3.0-or-later",        # this workspace itself
    "0BSD",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards         = "deny"
highlight         = "all"
deny              = []
skip              = []
skip-tree         = []

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
