name: avp
# Generated by `avp install`. Do not edit by hand — re-run `avp install`
# (with --force if you've made local changes you want to drop) to refresh.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: avp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-gate:
    runs-on: [self-hosted, linux, x64, plausiden]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: thepictishbeast/PlausiDen-AVP-Doctrine/.github/actions/avp-rust-gate@{{VERSION}}
        with:
          version: '{{VERSION}}'
          strictness: doctrine
          ratchet: avp-ratchet.toml
          test-density-min: '4.0'
        env:
          GITHUB_TOKEN: ${{ secrets.AVP_DOCTRINE_TOKEN }}
