# Doctrine — Accessibility rules.
# Schema: doctrine/rules/SCHEMA.md.

[meta]
doctrine_version = "1.0"
domain = "accessibility"
last_reviewed = "2026-05-20"

[[rule]]
id        = "a11y-001"
name      = "Every interactive element keyboard-operable end to end"
domain    = "accessibility"
statement = "Every interactive primitive (button, link, form field, menu, tab, disclosure, dialog) must be operable via keyboard alone with no mouse / pointer requirement, including Tab/Shift-Tab navigation, Enter/Space activation, Esc dismissal, and arrow-key navigation within composite widgets per WAI-ARIA Authoring Practices."
rationale = """
A user without a pointer (motor impairment, switch device, keyboard-
only workflow, screen reader) needs every interactive surface
reachable via keyboard. Failures are usually invisible to sighted
mouse users until reported. The discipline is that keyboard
operability is verified at primitive-introduction time, not retro-
fitted post-launch.
"""
enforcement = [
  "loom-components Interactive trait enforces keyboard handler declaration at the type level",
  "crawler runtime: keyboard_journey — Tab through every interactive on every page, asserts focusable + activatable",
  "forge phase: keyboard_operability_audit — verifies focus visibility + handler presence at build time",
]
applies_to    = ["every Interactive primitive", "every form on every site"]
severity      = "strict"
lifecycle     = "stable"
related_traits = ["KeyboardOperable", "Focusable", "Interactive"]
references    = ["WCAG 2.1.1 Keyboard", "WAI-ARIA Authoring Practices"]

[[rule]]
id        = "a11y-002"
name      = "Screen-reader testing per primitive with named semantic structure"
domain    = "accessibility"
statement = "Every primitive has a screen-reader test fixture exercising the rendered HTML with NVDA / VoiceOver / Orca-equivalent ARIA semantics; the test asserts the screen-reader announces the primitive with its declared accessible name + role."
rationale = """
ARIA without testing is hopeful but unverified. A primitive can declare
role=button while emitting a <div onclick>, which a screen reader
correctly announces as nothing useful. The fixture exercises the
actual rendered DOM with the ARIA APIs that screen readers consume,
asserting the announcement matches the declared intent.
"""
enforcement = [
  "crawler runtime: screen_reader_journey — exercises Aria APIs on rendered HTML, verifies accessible name + role",
  "forge phase: aria_semantics_audit — validates emitted ARIA attributes against role contract",
  "fixture diffs are reviewable artifacts; semantic regressions surface as Aria-tree diffs in PR review",
]
applies_to    = ["every Interactive primitive", "every primitive with structured semantics (heading, list, table, navigation, landmark)"]
severity      = "strict"
lifecycle     = "experimental"
related_traits = ["ScreenReaderAccessible"]
references    = ["WCAG 1.3.1 Info and Relationships", "WAI-ARIA 1.2"]

[[rule]]
id        = "a11y-003"
name      = "Color contrast meets WCAG AA minimum"
domain    = "accessibility"
statement = "Text contrast against its background must meet WCAG 2.1 AA: ≥ 4.5:1 for normal text, ≥ 3:1 for large text (18pt+ or 14pt+ bold). UI components (focus indicators, form borders) meet ≥ 3:1 against adjacent colors."
rationale = """
Insufficient contrast excludes users with low vision and degrades
readability for everyone in suboptimal lighting (sun glare, low-
quality displays, aging eyes). The substrate's tokens are selected
to meet AA by default in declared themes; deviations require explicit
opt-in via a low-contrast variant flagged as such.
"""
enforcement = [
  "forge phase: runtime_contrast — computes effective contrast on every visible text node, walking parent chain for translucent stacks",
  "loom-tokens contrast pairs are pre-computed at theme-build time; tokens generating < AA ratios fail the build",
  "crawler runtime: contrast_journey — measures rendered contrast in browser at each viewport",
]
applies_to    = ["every text node in rendered HTML", "every UI component border / focus indicator"]
severity      = "strict"
lifecycle     = "stable"
related_traits = ["ThemeAware", "ScreenReaderAccessible"]
references    = ["WCAG 1.4.3 Contrast Minimum", "WCAG 1.4.11 Non-text Contrast", "T100 runtime_contrast pinned axis"]

[[rule]]
id        = "a11y-004"
name      = "Reduced-motion respected; no required-motion interactions"
domain    = "accessibility"
statement = "Every animation respects `prefers-reduced-motion: reduce` by removing or substantially attenuating the motion; no interaction requires motion to complete (parallax, auto-rotating carousels, animated-only state transitions)."
rationale = """
Vestibular disorders are triggered by motion; large animations
cause physical illness in some users. The discipline is that motion
is decorative; reduced-motion users get the same content with the
motion suppressed. Auto-rotating carousels, scroll-jacking, and
parallax effects are forbidden by default; opt-in variants with the
reduced-motion alternative declared are permitted.
"""
enforcement = [
  "forge phase: reduced_motion_audit — scans emitted CSS for transitions, animations, transforms not gated by @media (prefers-reduced-motion: no-preference)",
  "crawler runtime: reduced_motion_journey — navigates with prefers-reduced-motion: reduce, asserts no motion exceeds the budget",
  "loom-tokens motion tokens come in reduced-motion variants; primitive CSS references them via media queries",
]
applies_to    = ["every CSS transition / animation / transform / scroll-snap in skin.css", "every primitive with motion behavior"]
severity      = "strict"
lifecycle     = "stable"
related_traits = ["RespectsReducedMotion"]
references    = ["WCAG 2.3.3 Animation from Interactions", "prim-001 (RespectsReducedMotion required)"]

[[rule]]
id        = "a11y-005"
name      = "Cognitive-load budget per page (reading level + decision density)"
domain    = "accessibility"
statement = "Each CMS content type declares its reading-level target (Flesch-Kincaid or equivalent) and decision density (per-section choice count); the substrate measures rendered content against the declared targets and flags violations."
rationale = """
Cognitive accessibility (WCAG 3.x in progress) addresses users with
cognitive impairments, language learners, distracted readers, low-
literacy populations. Pages dense with jargon or branching choices
exclude them. The discipline is measuring the cognitive load
explicitly per content type, surfacing pages that drift higher than
declared.
"""
enforcement = [
  "forge phase: reading_level_audit — computes Flesch-Kincaid on rendered text, compares to content-type target",
  "forge phase: decision_density_audit — counts user-choice surfaces per section, flags overload",
  "operator UI surfaces reading-level + decision-density per page; editor sees real-time signal",
]
applies_to    = ["every CMS content type with reader-facing prose", "every interactive form / wizard"]
severity      = "warn"
lifecycle     = "experimental"
related_traits = ["LocaleAware", "Reviewable"]
references    = ["WCAG 3.x cognitive accessibility (draft)", "content-001 (density floor per content type)"]
